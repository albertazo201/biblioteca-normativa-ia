<script>
'use strict';
const data = JSON.parse(document.getElementById('datos-biblioteca').textContent);
const byId = id => document.getElementById(id);
const node = (tag, content, className) => {
  const element = document.createElement(tag);
  if (content !== undefined) element.textContent = content;
  if (className) element.className = className;
  return element;
};
const normalize = value => String(value ?? '').normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();
const shown = value => value || 'PENDIENTE';
const title = entry => entry.titulo === 'PENDIENTE' ? `${entry.id} · Título pendiente` : shown(entry.titulo);
const tags = value => shown(value).split(';').map(tag => tag.trim()).filter(Boolean);
const dateNode = date => { const element = node('time', date); element.dateTime = date; return element; };
const isDate = value => /^\d{4}-\d{2}-\d{2}$/.test(value);
const badgeClass = {orientativo:'guide', vigente:'active', firme:'final', 'en tramitación':'wait', 'aplicación diferida':'wait', 'recurrido / anulado':'appeal', recurrido:'appeal', anulado:'appeal', decaído:'appeal'};
const safeLink = (url, text) => {
  try {
    const parsed = new URL(url);
    if (!['https:', 'http:'].includes(parsed.protocol)) return null;
    const link = node('a', text); link.href = parsed.href; link.target = '_blank'; link.rel = 'noopener noreferrer';
    return link;
  } catch { return null; }
};
const dialog = byId('dialogo');
function openFicha(entry) {
  byId('titulo-ficha').textContent = title(entry);
  const container = byId('contenido-ficha');
  container.replaceChildren();
  let table, ul;
  for (const line of entry.texto_ficha.split(/\r?\n/)) {
    if (line.startsWith('# ') || /^\|[-| :]+\|$/.test(line) || !line.trim()) continue;
    if (line.startsWith('|')) {
      if (!table) { table = node('table'); container.append(table); }
      const tr = table.insertRow();
      const [label, ...values] = line.replace(/^\||\|$/g, '').split('|');
      const value = values.join('|').trim();
      const field = node('th', label.trim()); field.scope = 'row'; tr.append(field);
      const cell = tr.insertCell();
      cell.append(safeLink(value, value) || document.createTextNode(value));
    } else if (line.startsWith('## ')) {
      ul = null;
      container.append(node('h3', line.slice(3)));
    } else if (line.startsWith('- ')) {
      if (!ul) { ul = node('ul'); container.append(ul); }
      ul.append(node('li', line.slice(2)));
    } else {
      ul = null;
      container.append(node('p', line));
    }
  }
  dialog.showModal();
}
function fichaButton(entry, label = 'Ver ficha') {
  const button = node('button', label); button.type = 'button';
  button.setAttribute('aria-label', `${label}: ${title(entry)}`);
  button.addEventListener('click', () => openFicha(entry));
  return button;
}
const filterDefs = [['tipo','Tipo'],['ambito','Ámbito'],['temas','Tema'],['estado','Estado'],['vinculante','Vinculante']];
const filters = new Map();
for (const [key, label] of filterDefs) {
  const values = [...new Set(data.documentos.flatMap(entry => key === 'temas' ? tags(entry[key]) : [shown(entry[key])]))];
  const select = node('select'); select.id = `filtro-${key}`;
  select.add(new Option('Todos', ''));
  for (const value of values.sort((a, b) => a.localeCompare(b, 'es'))) select.add(new Option(value === 'guia' ? 'guía' : value, value));
  const wrapper = node('label', label); wrapper.htmlFor = select.id; wrapper.append(select);
  byId('filtros').append(wrapper); filters.set(key, select);
  select.addEventListener('change', render);
}
let visible = [];
function render() {
  const terms = normalize(byId('consulta').value).trim().split(/\s+/).filter(Boolean);
  visible = data.documentos.filter(entry => {
    const index = normalize([entry.titulo, entry.organismo, entry.resumen, entry.temas].join(' '));
    return terms.every(term => index.includes(term)) && [...filters].every(([key, select]) =>
      !select.value || (key === 'temas' ? tags(entry[key]).includes(select.value) : shown(entry[key]) === select.value));
  });
  byId('resultado').textContent = `${visible.length} de ${data.documentos.length} documentos`;
  byId('exportar').disabled = visible.length === 0;
  const cards = byId('tarjetas'); cards.replaceChildren();
  if (!visible.length) cards.append(node('p', 'No hay documentos que coincidan con la búsqueda.', 'empty'));
  for (const entry of visible) {
    const card = node('article', undefined, 'card');
    const state = shown(entry.estado);
    card.append(node('span', state, `badge ${badgeClass[state] ?? ''}`), node('h3', title(entry)),
      node('p', `${entry.id} · ${shown(entry.organismo)} · ${shown(entry.fecha)}`, 'meta'), node('p', shown(entry.resumen), 'summary'));
    const foot = node('div', undefined, 'foot');
    const official = safeLink(entry.url, 'Fuente oficial');
    if (official) foot.append(official);
    foot.append(fichaButton(entry)); card.append(foot); cards.append(card);
  }
}
const csvCell = entry => {
  let value = String(entry ?? '');
  if (/^\s*[=+\-@]|^[\t\r\n]/.test(value)) value = "'" + value;
  return '"' + value.replaceAll('"', '""') + '"';
};
function exportar() {
  const rows = [data.columnas, ...visible.map(entry => data.columnas.map(key => entry[key]))];
  const csv = '\uFEFF' + rows.map(row => row.map(csvCell).join(';')).join('\r\n') + '\r\n';
  const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  const a = node('a'); a.href = url; a.download = `biblioteca-${data.actualizado}.csv`;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function news() {
  const end = new Date(`${data.actualizado}T00:00:00Z`);
  const start = new Date(end); start.setUTCDate(start.getUTCDate() - 27);
  const from = start.toISOString().slice(0,10);
  byId('updated').dateTime = data.actualizado; byId('updated').textContent = data.actualizado;
  byId('periodo').textContent = `${from} a ${data.actualizado}`;
  const inPeriod = value => isDate(value) && value >= from && value <= data.actualizado;
  const additions = data.documentos.filter(entry => inPeriod(entry.fecha_alta)).sort((a,b) => b.fecha_alta.localeCompare(a.fecha_alta));
  if (additions.length) {
    const details = node('details'); const list = node('ul');
    details.append(node('summary', `${additions.length} registros añadidos al índice`), list);
    for (const entry of additions) { const item = node('li'); item.append(dateNode(entry.fecha_alta), ' · ', fichaButton(entry,title(entry))); list.append(item); }
    byId('altas').append(details);
  } else byId('altas').append(node('p', 'Sin incorporaciones en este periodo.', 'muted'));
  const changes = data.cambios.filter(change => inPeriod(change.fecha)).sort((a,b) => b.fecha.localeCompare(a.fecha));
  if (changes.length) {
    const list = node('ul');
    for (const change of changes) { const item = node('li'); const link = safeLink(change.url,'Fuente'); item.append(dateNode(change.fecha), ` · ${change.texto}`); if (link) item.append(' · ',link); list.append(item); }
    byId('cambios').append(list);
  } else byId('cambios').append(node('p', 'Sin cambios de estado confirmados en el periodo revisado.', 'muted'));
}
function timeline() {
  const entries = new Map(data.documentos.map(entry => [entry.id,entry]));
  for (const event of data.fechas.toSorted((a,b) => a.fecha.localeCompare(b.fecha) || a.id.localeCompare(b.id))) {
    const item = node('li'); const description = node('div'); const link = safeLink(event.url,'Fuente');
    description.append(fichaButton(entries.get(event.id),event.id), event.texto);
    if (link) description.append(' · ',link);
    item.append(dateNode(event.fecha),description); byId('cronologia').append(item);
  }
}
byId('busqueda').addEventListener('submit', event => event.preventDefault());
byId('consulta').addEventListener('input', render);
byId('limpiar').addEventListener('click', () => { byId('busqueda').reset(); render(); byId('consulta').focus(); });
byId('exportar').addEventListener('click', exportar);
news(); timeline(); render();
</script>
</body>
